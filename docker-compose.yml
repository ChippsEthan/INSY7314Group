services:
  mongo:
    image: mongo:latest
    container_name: hustlehub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: . 
    container_name: hustlehub_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: hustlehub_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data: