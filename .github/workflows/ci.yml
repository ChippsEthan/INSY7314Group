name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend - install, test, build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Create a throw-away JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
           
      - name: Run backend tests
        run: npm test

      - name: Build check (syntax-check every backend source file)
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./client/*" \
            -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend - install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build


  api-tests:
    name: Newman API tests
    runs-on: ubuntu-latest
    needs: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: 5000
      NODE_ENV: development
      SALT_ROUNDS: 10
      MONGO_URI: mongodb://localhost:27017/hustlehub_ci
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate a throw-away HTTPS certificate and JWT secret
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 1 -nodes -subj "/CN=localhost"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start the API
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -ksf https://localhost:5000/api/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          cat server.log
          exit 1

      - name: Install Newman
        run: npm install -g newman@6

      - name: Run Newman collection
        run: npm run test:api

      - name: Show server log if the tests failed
        if: failure()
        run: cat server.log

  security:
    name: Security - npm audit and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (backend, production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (frontend, production dependencies)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker - build, compose up, image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create throw-away HTTPS certificate and .env for the stack
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 1 -nodes -subj "/CN=localhost"
            chmod 644 key.pem cert.pem
          {
            echo "PORT=5000"
            echo "NODE_ENV=production"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SALT_ROUNDS=10"
            echo "MONGO_URI=mongodb://mongo:27017/hustlehub"
          } > .env

      - name: Build backend image
        run: docker build -t hustlehub-backend:ci .

      - name: Build frontend image
        run: docker build -t hustlehub-frontend:ci ./client

      - name: Start the full stack with Docker Compose
        run: docker compose up --build -d

      - name: Smoke test the running stack
        run: |
          for i in $(seq 1 30); do
            if curl -ksf https://localhost:5000/api/health > /dev/null; then
              echo "Backend healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Backend did not become healthy"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:3000 > /dev/null && echo "Frontend is serving"

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Scan backend image (Grype)
        uses: anchore/scan-action@v7
        with:
          image: hustlehub-backend:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

      - name: Scan frontend image (Grype)
        uses: anchore/scan-action@v7
        with:
          image: hustlehub-frontend:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true







      - name: Show backend image findings (only runs on failure)
        if: failure()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest hustlehub-frontend:ci --only-fixed -q | grep -E "NAME|Critical" || true
